<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>From one address to a jurisdiction map</title>
  <style>
    *{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden}body{font-family:Inter,Arial,sans-serif;background:#081317;color:#fff}.scene{position:relative;width:100vw;height:100vh;background:radial-gradient(circle at 75% 22%,#31414a 0,#132329 30%,#081317 72%);isolation:isolate}.grid{position:absolute;inset:-20%;background-image:linear-gradient(rgba(255,255,255,.055) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.055) 1px,transparent 1px);background-size:42px 42px;transform:perspective(520px) rotateX(57deg) translateY(28%);animation:grid 6s linear infinite}.copy{position:absolute;left:6%;top:10%;width:58%;z-index:5}.kicker{display:inline-block;padding:6px 10px;border:1px solid #e85d26;background:rgba(8,19,23,.72);color:#ffb18f;font-size:clamp(9px,1.3vw,13px);font-weight:900;letter-spacing:.14em;text-transform:uppercase}.title{margin:13px 0 0;font-size:clamp(27px,6vw,64px);line-height:.94;font-weight:950;letter-spacing:-.05em;text-shadow:0 8px 24px #000}.title em{display:block;color:#e85d26;font-style:normal}.address{position:absolute;right:6%;top:10%;width:27%;padding:13px 14px;border-radius:8px;background:#fff;color:#081317;font-size:clamp(8px,1.3vw,14px);font-weight:900;box-shadow:0 16px 40px rgba(0,0,0,.35);animation:address 5s ease-in-out infinite}.pin{display:inline-flex;margin-right:6px;width:11px;height:11px;border-radius:50%;background:#e85d26;box-shadow:0 0 0 0 rgba(232,93,38,.55);animation:ring 1.8s infinite}.cards{position:absolute;left:6%;right:6%;bottom:17%;display:grid;grid-template-columns:repeat(5,1fr);gap:9px;z-index:4}.card{min-height:65px;padding:12px 10px;border-top:5px solid #e85d26;background:rgba(245,240,234,.96);color:#081317;box-shadow:0 14px 32px rgba(0,0,0,.38);transform:translateY(85px);opacity:0;animation:card 6.2s cubic-bezier(.2,.8,.2,1) infinite;animation-delay:calc(var(--i)*.35s)}.card b{display:block;font-size:clamp(9px,1.45vw,16px)}.card span{display:block;margin-top:5px;color:#576369;font-size:clamp(7px,.95vw,11px);font-weight:700}.rail{position:absolute;left:6%;right:6%;bottom:9%;height:7px;border-radius:20px;background:rgba(255,255,255,.13);overflow:hidden}.progress{height:100%;width:22%;background:#e85d26;box-shadow:0 0 18px #e85d26;animation:progress 5s ease-in-out infinite}.sweep{position:absolute;top:-25%;bottom:-25%;left:-34%;width:24%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.23),transparent);transform:skewX(-18deg);animation:sweep 5.4s ease-in-out infinite;z-index:6}@keyframes grid{to{background-position:42px 42px}}@keyframes address{0%,100%{transform:translateY(8px) scale(.98);opacity:.72}20%,78%{transform:translateY(0) scale(1);opacity:1}}@keyframes ring{70%{box-shadow:0 0 0 18px rgba(232,93,38,0)}}@keyframes card{0%{transform:translateY(85px);opacity:0}18%,72%{transform:translateY(0);opacity:1}100%{transform:translateY(-16px);opacity:0}}@keyframes progress{0%{transform:translateX(-120%)}76%,100%{transform:translateX(455%)}}@keyframes sweep{0%,10%{left:-34%}60%,100%{left:125%}}@media(max-width:620px){.copy{top:7%;width:68%}.title{font-size:24px}.address{right:4%;top:8%;width:28%;padding:7px;font-size:7px}.cards{left:4%;right:4%;bottom:18%;grid-template-columns:repeat(3,1fr);gap:4px}.card{min-height:40px;padding:6px;border-top-width:3px}.card span{display:none}.card:nth-child(n+4){display:none}.rail{left:4%;right:4%;bottom:10%}}
  </style>
</head>
<body><div class="scene"><div class="grid"></div><div class="copy"><div class="kicker">Start with authority</div><div class="title">One Address.<em>Five Agencies.</em></div></div><div class="address"><span class="pin"></span>PROPERTY MATCH VERIFIED</div><div class="cards"><div class="card" style="--i:0"><b>ASSESSMENT</b><span>parcel identity</span></div><div class="card" style="--i:1"><b>GIS</b><span>mapped layers</span></div><div class="card" style="--i:2"><b>COURT</b><span>deeds and plats</span></div><div class="card" style="--i:3"><b>PERMITS</b><span>plans and approvals</span></div><div class="card" style="--i:4"><b>HEALTH</b><span>well and septic</span></div></div><div class="rail"><div class="progress"></div></div><div class="sweep"></div></div></body>
</html>
