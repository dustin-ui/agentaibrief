<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>GPT-5.6 AI Operator Workflow</title>
  <style>
    *{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#071014;color:#fff;font-family:Arial,sans-serif}.scene{position:relative;width:100%;height:100%;background:radial-gradient(circle at 78% 20%,#26333a 0,#0b171c 34%,#071014 70%)}.grid{position:absolute;inset:-20%;background-image:linear-gradient(rgba(255,255,255,.045) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.045) 1px,transparent 1px);background-size:44px 44px;transform:perspective(500px) rotateX(56deg) translateY(25%);animation:grid 7s linear infinite}.copy{position:absolute;left:6%;top:10%;width:68%;z-index:4}.eyebrow{display:inline-flex;padding:6px 10px;outline:1px solid #e85d26;color:#ffb08c;background:#071014d9;font-size:clamp(9px,1.4vw,14px);font-weight:900;letter-spacing:.12em}.headline{margin-top:14px;font-size:clamp(27px,6.2vw,68px);line-height:.92;font-weight:900;letter-spacing:-.045em;text-shadow:0 7px 24px #000;animation:headline 6s ease-in-out infinite}.headline em{display:block;color:#e85d26;font-style:normal}.cards{position:absolute;left:6%;right:6%;bottom:18%;display:grid;grid-template-columns:repeat(4,1fr);gap:10px;z-index:5}.card{min-height:68px;padding:13px 12px;background:#eef2f1f0;color:#071014;box-shadow:inset 0 5px #e85d26,0 14px 35px #0006;transform:translateY(90px);opacity:0;animation:card 6.4s cubic-bezier(.2,.8,.2,1) infinite;animation-delay:calc(var(--i)*.34s)}.card b{display:block;font-size:clamp(10px,1.65vw,18px)}.card span{display:block;margin-top:6px;font-size:clamp(8px,1.1vw,12px);font-weight:700;color:#4c5a60}.rail{position:absolute;left:6%;right:6%;bottom:9%;height:6px;background:#ffffff26;border-radius:20px;overflow:hidden;z-index:5}.progress{height:100%;width:22%;background:#e85d26;box-shadow:0 0 18px #e85d26;animation:progress 5.6s ease-in-out infinite}.sweep{position:absolute;top:-20%;bottom:-20%;left:-35%;width:28%;background:linear-gradient(90deg,transparent,#ffffff40,transparent);transform:skewX(-18deg);animation:sweep 5.4s ease-in-out infinite;z-index:6}@keyframes grid{to{background-position:44px 44px}}@keyframes headline{0%,100%{transform:translateX(-22px);opacity:.55}18%,78%{transform:translateX(0);opacity:1}}@keyframes card{0%{transform:translateY(90px);opacity:0}18%,72%{transform:translateY(0);opacity:1}100%{transform:translateY(-22px);opacity:0}}@keyframes progress{0%{transform:translateX(-110%)}75%,100%{transform:translateX(460%)}}@keyframes sweep{0%,8%{left:-35%}62%,100%{left:125%}}@media(max-width:620px){.headline{font-size:27px}.cards{grid-template-columns:repeat(2,1fr);gap:5px}.card{min-height:46px;padding:8px}.card span{display:none}}
  </style>
</head>
<body><div class="scene"><div class="grid"></div><div class="copy"><div class="eyebrow">SCOPED WORK. VISIBLE PROOF.</div><div class="headline">GPT-5.6<em>AI OPERATOR</em></div></div><div class="cards"><div class="card" style="--i:0"><b>PERMISSIONS</b><span>least access needed</span></div><div class="card" style="--i:1"><b>APPROVALS</b><span>people control impact</span></div><div class="card" style="--i:2"><b>LOGS</b><span>every step recorded</span></div><div class="card" style="--i:3"><b>QA</b><span>results get tested</span></div></div><div class="rail"><div class="progress"></div></div><div class="sweep"></div></div></body>
</html>
