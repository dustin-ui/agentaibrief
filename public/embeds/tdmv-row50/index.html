<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>King Spa Chantilly Review and Guide (2026)</title>
  <style>
    *{box-sizing:border-box}
    html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#071b22;color:#fff;font-family:Arial,sans-serif}
    .scene{position:relative;width:100%;height:100%;padding:7%;background:radial-gradient(circle at 80% 18%,#37b0c966,transparent 36%),linear-gradient(135deg,#081d24,#214b56)}
    .tag{font-size:clamp(10px,1.8vw,18px);font-weight:900;letter-spacing:.15em;color:#9ae7f1}
    h1{font-size:clamp(25px,5.5vw,64px);line-height:.94;max-width:60%;margin:10px 0 0;letter-spacing:-.04em;animation:rise 5.5s ease-in-out infinite}
    .pool{position:absolute;right:3%;bottom:10%;width:44%;height:51%;border-radius:50% 50% 28% 28%;background:radial-gradient(circle at 50% 50%,#bff6ff 0 7%,#37b0c9 8% 48%,#0b3542 49% 100%);border:7px solid #dffbff;transform:perspective(600px) rotateX(54deg);box-shadow:0 0 36px #37b0c988;animation:water 2.2s ease-in-out infinite}
    .steam i{position:absolute;bottom:42%;width:4%;height:34%;border-left:5px solid #fff8;border-radius:50%;animation:steam 3s ease-in-out infinite}
    .steam i:nth-child(1){right:12%}
    .steam i:nth-child(2){right:22%;animation-delay:.7s}
    .steam i:nth-child(3){right:32%;animation-delay:1.4s}
    .meter{position:absolute;left:7%;bottom:9%;width:39%;height:7px;background:#ffffff30;border-radius:9px;overflow:hidden}
    .meter:after{content:"";display:block;height:100%;background:#37b0c9;animation:fill 5.5s ease-in-out infinite}
    @keyframes rise{0%,100%{transform:translateY(16px);opacity:.45}25%,75%{transform:none;opacity:1}}
    @keyframes water{50%{filter:brightness(1.25);transform:perspective(600px) rotateX(54deg) scale(1.035)}}
    @keyframes steam{0%,100%{transform:translateY(20px) scale(.75);opacity:0}45%{opacity:1}70%{transform:translateY(-45px) scale(1.2);opacity:0}}
    @keyframes fill{0%{width:5%}80%,100%{width:100%}}
  </style>
</head>
<body>
  <div class="scene">
    <div class="tag">KING SPA · CHANTILLY</div>
    <h1>KING SPA: WORTH IT?</h1>
    <div class="pool"></div>
    <div class="steam"><i></i><i></i><i></i></div>
    <div class="meter"></div>
  </div>
</body>
</html>
