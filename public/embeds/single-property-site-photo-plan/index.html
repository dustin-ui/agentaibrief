<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>From listing photos to a planned property site</title>
  <style>
    *{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden}body{font-family:Inter,Arial,sans-serif;background:#071014;color:#fff}.scene{position:relative;width:100vw;height:100vh;background:radial-gradient(circle at 82% 18%,#34454d 0,#13242a 29%,#071014 72%);isolation:isolate}.grid{position:absolute;inset:-15%;background-image:linear-gradient(rgba(255,255,255,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.05) 1px,transparent 1px);background-size:42px 42px;transform:perspective(560px) rotateX(58deg) translateY(29%);animation:grid 6s linear infinite}.copy{position:absolute;left:6%;top:9%;z-index:5}.kicker{display:inline-block;padding:6px 10px;border:1px solid #e85d26;background:rgba(7,16,20,.78);color:#ffb18f;font-size:clamp(9px,1.25vw,13px);font-weight:900;letter-spacing:.14em;text-transform:uppercase}.title{margin:13px 0 0;font-size:clamp(27px,6vw,66px);line-height:.93;font-weight:950;letter-spacing:-.05em;text-shadow:0 8px 26px #000}.title em{display:block;color:#e85d26;font-style:normal}.flow{position:absolute;left:6%;right:6%;bottom:17%;display:grid;grid-template-columns:repeat(3,1fr);gap:36px;z-index:4}.card{position:relative;min-height:96px;padding:17px 15px;border-top:6px solid #e85d26;background:#f6f1ea;color:#071014;box-shadow:0 16px 38px rgba(0,0,0,.42);transform:translateY(92px);opacity:0;animation:card 6.2s cubic-bezier(.2,.8,.2,1) infinite;animation-delay:calc(var(--i)*.45s)}.card b{display:block;font-size:clamp(11px,1.8vw,20px);line-height:1}.card span{display:block;margin-top:8px;color:#58656a;font-size:clamp(8px,1vw,12px);font-weight:700}.card:not(:last-child):after{content:"";position:absolute;right:-30px;top:43%;width:24px;height:4px;background:#e85d26;box-shadow:0 0 16px #e85d26;animation:beam 1.8s ease-in-out infinite}.rail{position:absolute;left:6%;right:6%;bottom:8%;height:7px;border-radius:20px;background:rgba(255,255,255,.14);overflow:hidden}.progress{height:100%;width:25%;background:#e85d26;box-shadow:0 0 18px #e85d26;animation:progress 4.8s ease-in-out infinite}.sweep{position:absolute;top:-25%;bottom:-25%;left:-34%;width:23%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.25),transparent);transform:skewX(-18deg);animation:sweep 5.5s ease-in-out infinite;z-index:7}@keyframes grid{to{background-position:42px 42px}}@keyframes card{0%{transform:translateY(92px);opacity:0}18%,73%{transform:translateY(0);opacity:1}100%{transform:translateY(-18px);opacity:0}}@keyframes beam{50%{transform:scaleX(1.32);filter:brightness(1.4)}}@keyframes progress{0%{transform:translateX(-120%)}77%,100%{transform:translateX(410%)}}@keyframes sweep{0%,10%{left:-34%}60%,100%{left:126%}}@media(max-width:620px){.copy{top:7%;width:82%}.title{font-size:24px}.flow{left:4%;right:4%;bottom:18%;gap:9px}.card{min-height:54px;padding:8px;border-top-width:3px}.card span{display:none}.card:not(:last-child):after{right:-8px;width:7px;height:2px}.rail{left:4%;right:4%;bottom:10%}}
  </style>
</head>
<body><div class="scene"><div class="grid"></div><div class="copy"><div class="kicker">The photos become the plan</div><div class="title">See Every Frame.<em>Build One Story.</em></div></div><div class="flow"><div class="card" style="--i:0"><b>INSPECT</b><span>Review every listing photo</span></div><div class="card" style="--i:1"><b>ORGANIZE</b><span>Room, level, quality, order</span></div><div class="card" style="--i:2"><b>APPROVE</b><span>Confirm hero, cuts, and plan</span></div></div><div class="rail"><div class="progress"></div></div><div class="sweep"></div></div></body>
</html>
