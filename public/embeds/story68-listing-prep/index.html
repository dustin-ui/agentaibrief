<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * { box-sizing: border-box; }
      html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #101114; }
      body { font-family: Arial, Helvetica, sans-serif; color: #fff; }
      #root { position: absolute; width: 1920px; height: 1080px; overflow: hidden; background: #101114; transform-origin: top left; }
      .scene { position: absolute; inset: 0; overflow: hidden; background: radial-gradient(circle at 76% 18%, rgba(232,93,38,.25), transparent 34%), linear-gradient(135deg, #101114 0%, #24262b 55%, #111215 100%); }
      .grid { position: absolute; inset: -80px; opacity: .28; background-image: linear-gradient(rgba(255,255,255,.08) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,.08) 1px, transparent 1px); background-size: 64px 64px; transform: perspective(820px) rotateX(58deg) translateY(300px); }
      .sweep { position: absolute; top: 0; bottom: 0; left: -420px; width: 320px; background: linear-gradient(90deg, transparent, rgba(232,93,38,.22), rgba(255,255,255,.16), transparent); transform: skewX(-18deg); }
      .brand { position: absolute; left: 104px; top: 76px; font-size: 26px; font-weight: 900; letter-spacing: .12em; color: #f5f0ea; }
      .brand strong { color: #e85d26; }
      .copy { position: absolute; left: 104px; top: 160px; width: 1200px; }
      .kicker { display: inline-block; padding: 12px 18px; border: 2px solid #e85d26; color: #f5f0ea; font-size: 24px; font-weight: 900; letter-spacing: .08em; text-transform: uppercase; background: rgba(16,17,20,.72); }
      h1 { margin: 28px 0 0; max-width: 1220px; font-size: 106px; line-height: .92; letter-spacing: -.045em; text-transform: uppercase; color: #fff; text-shadow: 0 8px 32px rgba(0,0,0,.5); }
      h1 em { display: block; color: #e85d26; font-style: normal; }
      .rail { position: absolute; left: 104px; right: 104px; bottom: 186px; height: 190px; }
      .line { position: absolute; left: 60px; right: 60px; top: 92px; height: 10px; background: rgba(245,240,234,.28); border-radius: 99px; overflow: hidden; }
      .progress { width: 100%; height: 100%; transform-origin: left center; background: linear-gradient(90deg, #c44a1a, #e85d26, #ffb08e); box-shadow: 0 0 28px rgba(232,93,38,.8); }
      .runner { position: absolute; left: 49px; top: 73px; width: 48px; height: 48px; border-radius: 50%; background: #fff; border: 10px solid #e85d26; box-shadow: 0 0 28px rgba(232,93,38,.95); z-index: 5; }
      .steps { position: absolute; inset: 0; z-index: 6; display: grid; grid-template-columns: repeat(5, 1fr); gap: 26px; }
      .step { align-self: end; min-height: 142px; padding: 24px 22px; border-top: 8px solid #e85d26; background: #f5f0ea; color: #202126; box-shadow: 0 20px 44px rgba(0,0,0,.38); }
      .step b { display: block; font-size: 28px; line-height: 1; }
      .step span { display: block; margin-top: 12px; color: #555b62; font-size: 20px; font-weight: 700; line-height: 1.25; }
      .approval { position: absolute; right: 110px; top: 92px; width: 310px; height: 310px; border: 4px solid #e85d26; border-radius: 50%; display: grid; place-items: center; background: rgba(16,17,20,.82); box-shadow: 0 0 64px rgba(232,93,38,.35); }
      .approval .check { width: 130px; height: 72px; border-left: 24px solid #fff; border-bottom: 24px solid #fff; transform: rotate(-45deg) translate(8px,-8px); }
      .approval p { position: absolute; bottom: 48px; margin: 0; color: #f5f0ea; font-size: 22px; font-weight: 900; letter-spacing: .05em; }
      .footer { position: absolute; left: 104px; right: 104px; bottom: 68px; z-index: 12; display: flex; justify-content: space-between; align-items: center; color: #f5f0ea; font-size: 24px; font-weight: 800; }
      .footer strong { color: #e85d26; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="9" data-width="1920" data-height="1080">
      <section id="scene" class="scene clip" data-start="0" data-duration="9" data-track-index="1">
        <div class="grid" data-layout-allow-overflow></div>
        <div class="sweep" data-layout-allow-overflow></div>
        <div class="brand">Agent<strong>AI</strong>Brief</div>
        <div class="copy">
          <div id="kicker" class="kicker">Codex Record &amp; Replay</div>
          <h1 id="headline">Show it once.<em>Run the process again.</em></h1>
        </div>
        <div id="final-review" class="approval">
          <div class="check"></div>
          <p>HUMAN APPROVAL</p>
        </div>
        <div class="rail">
          <div class="line"><div class="progress"></div></div>
          <div class="runner"></div>
          <div class="steps">
            <div id="step-address" class="step"><b>ADDRESS</b><span>Begin with one property</span></div>
            <div id="step-facts" class="step"><b>FACTS</b><span>Use approved sources</span></div>
            <div id="step-comps" class="step"><b>COMPS</b><span>Apply written rules</span></div>
            <div id="step-deck" class="step"><b>DECK + CMA</b><span>Build aligned drafts</span></div>
            <div id="step-review" class="step"><b>REVIEW</b><span>Agent checks every claim</span></div>
          </div>
        </div>
        <div class="footer"><span>Repeatable process, not automated judgment.</span><strong>AGENTAIBRIEF OPERATIONS</strong></div>
      </section>
    </div>
    <script>
      const root = document.querySelector('#root');
      const fitCanvas = () => {
        const scale = Math.min(innerWidth / 1920, innerHeight / 1080);
        root.style.transform = `scale(${scale})`;
        root.style.left = `${Math.max(0, (innerWidth - 1920 * scale) / 2)}px`;
        root.style.top = `${Math.max(0, (innerHeight - 1080 * scale) / 2)}px`;
      };
      fitCanvas();
      addEventListener('resize', fitCanvas);
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      tl.fromTo('#kicker', { y: 36, opacity: 0 }, { y: 0, opacity: 1, duration: .55, ease: 'power3.out' }, .15);
      tl.fromTo('#headline', { x: -70, opacity: 0 }, { x: 0, opacity: 1, duration: .8, ease: 'power3.out' }, .35);
      tl.fromTo('.step', { y: 60 }, { y: 0, duration: .72, stagger: .42, ease: 'back.out(1.25)' }, .8);
      tl.fromTo('.progress', { scaleX: 0 }, { scaleX: 1, duration: 5.8, ease: 'power1.inOut' }, .75);
      tl.fromTo('.runner', { x: 0 }, { x: 1550, duration: 5.8, ease: 'power1.inOut' }, .75);
      tl.fromTo('#final-review', { scale: .7, opacity: 0, rotate: -8 }, { scale: 1, opacity: 1, rotate: 0, duration: .75, ease: 'back.out(1.4)' }, 5.75);
      tl.fromTo('#final-review .check', { scale: 0, opacity: 0 }, { scale: 1, opacity: 1, duration: .5, ease: 'back.out(1.8)' }, 6.15);
      tl.to('.sweep', { x: 2550, duration: 3.6, ease: 'power1.inOut' }, 1.2);
      tl.fromTo('.grid', { backgroundPosition: '0px 0px' }, { backgroundPosition: '90px 90px', duration: 9, ease: 'none' }, 0);
      tl.to('#final-review', { boxShadow: '0 0 94px rgba(232,93,38,.72)', duration: .7, repeat: 2, yoyo: true, ease: 'sine.inOut' }, 6.65);
      tl.to('.runner', { scale: 1.28, duration: .45, repeat: 5, yoyo: true, ease: 'sine.inOut' }, 6.45);
      window.__timelines.main = tl;
      if (new URLSearchParams(location.search).get('autoplay') === '1') {
        tl.repeat(-1).repeatDelay(.8).play(0);
      }
    </script>
  </body>
</html>
