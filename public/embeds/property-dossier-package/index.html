<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Verified delivery package</title>
  <style>
    *{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden}body{font-family:Inter,Arial,sans-serif;background:#071217;color:#fff}.scene{position:relative;width:100vw;height:100vh;background:radial-gradient(circle at 28% 32%,#253740 0,#0c1b21 40%,#071217 74%)}.copy{position:absolute;left:6%;top:9%;width:64%;z-index:5}.kicker{display:inline-flex;padding:6px 10px;background:#e85d26;color:#fff;font-size:clamp(9px,1.25vw,13px);font-weight:950;letter-spacing:.13em;text-transform:uppercase}.title{margin:13px 0 0;font-size:clamp(27px,5.8vw,63px);line-height:.94;font-weight:950;letter-spacing:-.045em;text-shadow:0 8px 26px #000}.title em{display:block;color:#ff9b70;font-style:normal}.folder{position:absolute;right:8%;top:9%;width:25%;height:35%;background:#f5f0ea;border-radius:8px 8px 12px 12px;box-shadow:0 20px 50px rgba(0,0,0,.45);transform:rotate(4deg);animation:folder 5.6s ease-in-out infinite}.folder:before{content:"";position:absolute;left:0;top:-10%;width:48%;height:16%;border-radius:7px 7px 0 0;background:#e85d26}.folder:after{content:"DOSSIER";position:absolute;left:12%;top:28%;color:#071217;font-size:clamp(11px,2vw,22px);font-weight:950;letter-spacing:.1em}.docs{position:absolute;left:6%;right:6%;bottom:17%;display:grid;grid-template-columns:repeat(5,1fr);gap:9px}.doc{position:relative;min-height:76px;padding:12px 10px;background:#fff;color:#071217;box-shadow:0 15px 34px rgba(0,0,0,.42);transform:translateY(90px) rotate(var(--r));opacity:0;animation:doc 6.5s cubic-bezier(.2,.8,.2,1) infinite;animation-delay:calc(var(--i)*.32s)}.doc:before{content:"";display:block;width:42%;height:5px;margin-bottom:9px;background:#e85d26}.doc b{display:block;font-size:clamp(8px,1.25vw,14px)}.doc span{display:block;margin-top:7px;height:3px;background:#cbd2d5;box-shadow:0 7px 0 #dbe0e2,0 14px 0 #dbe0e2}.check{position:absolute;right:8%;bottom:8%;display:flex;align-items:center;gap:8px;font-size:clamp(9px,1.25vw,14px);font-weight:950;color:#cde7dd}.check i{display:grid;place-items:center;width:30px;height:30px;border-radius:50%;background:#3ba36c;color:#fff;font-style:normal;animation:pop 2s ease-in-out infinite}.line{position:absolute;left:6%;right:6%;bottom:9%;height:5px;border-radius:9px;background:rgba(255,255,255,.14);overflow:hidden}.line i{display:block;width:24%;height:100%;background:#e85d26;box-shadow:0 0 18px #e85d26;animation:line 4.8s ease-in-out infinite}.sweep{position:absolute;left:-35%;top:-20%;width:27%;height:140%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.19),transparent);transform:skewX(-18deg);animation:sweep 5.2s ease-in-out infinite}@keyframes folder{0%,100%{transform:rotate(4deg) translateY(7px)}50%{transform:rotate(1deg) translateY(0)}}@keyframes doc{0%{transform:translateY(90px) rotate(var(--r));opacity:0}18%,76%{transform:translateY(0) rotate(0);opacity:1}100%{transform:translateY(-18px) rotate(calc(var(--r)*-1));opacity:0}}@keyframes pop{50%{transform:scale(1.12);box-shadow:0 0 0 10px rgba(59,163,108,.13)}}@keyframes line{0%{transform:translateX(-110%)}78%,100%{transform:translateX(425%)}}@keyframes sweep{0%,9%{left:-35%}60%,100%{left:125%}}@media(max-width:620px){.copy{left:4%;top:7%;width:71%}.title{font-size:23px}.folder{right:4%;top:9%;width:24%;height:27%}.folder:after{font-size:8px}.docs{left:4%;right:4%;bottom:19%;grid-template-columns:repeat(3,1fr);gap:4px}.doc{min-height:48px;padding:6px}.doc:nth-child(n+4){display:none}.doc span{margin-top:4px;height:2px;box-shadow:0 5px 0 #dbe0e2,0 10px 0 #dbe0e2}.check{right:4%;bottom:9%;font-size:7px}.check i{width:20px;height:20px}.line{left:4%;right:4%;bottom:10%}}
  </style>
</head>
<body><div class="scene"><div class="copy"><div class="kicker">Human reviewed</div><div class="title">One Package.<em>Visible Proof.</em></div></div><div class="folder"></div><div class="docs"><div class="doc" style="--i:0;--r:-5deg"><b>SUMMARY</b><span></span></div><div class="doc" style="--i:1;--r:4deg"><b>SOURCE INDEX</b><span></span></div><div class="doc" style="--i:2;--r:-3deg"><b>ATTACHMENTS</b><span></span></div><div class="doc" style="--i:3;--r:5deg"><b>GAPS</b><span></span></div><div class="doc" style="--i:4;--r:-4deg"><b>MANIFEST</b><span></span></div></div><div class="line"><i></i></div><div class="check"><i>✓</i>DELIVERY VERIFIED</div><div class="sweep"></div></div></body>
</html>
