<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Town Center Shift</title>
  <style>
    *{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#10252b;color:#fff;font-family:Arial,sans-serif}.scene{position:relative;width:100%;height:100%;padding:7%;background:radial-gradient(circle at 80% 20%,#37b0c955,transparent 36%),linear-gradient(135deg,#10252b,#1d4853)}.headline{max-width:70%;font-size:clamp(22px,5vw,60px);font-weight:800;line-height:1;transform:translateY(14px);opacity:.35;animation:rise 7s ease-in-out infinite}.cards{position:absolute;right:6%;bottom:14%;display:grid;gap:10px}.card{padding:10px 14px;background:#ffffffed;color:#16323a;box-shadow:inset 5px 0 #37b0c9,0 12px 30px #0005;border-radius:10px;font-size:clamp(11px,2vw,20px);font-weight:700;animation:float 5s ease-in-out infinite}.card:nth-child(2){animation-delay:-1.2s}.card:nth-child(3){animation-delay:-2.4s}.sweep{position:absolute;top:-40%;bottom:-40%;left:-25%;width:16%;background:linear-gradient(90deg,transparent,#ffffff35,transparent);transform:rotate(18deg);animation:sweep 6s linear infinite}.progress{position:absolute;left:7%;right:7%;bottom:7%;height:5px;background:#ffffff30;border-radius:9px;overflow:hidden}.progress span{display:block;height:100%;background:#37b0c9;animation:progress 7s ease-in-out infinite}@keyframes rise{0%,100%{transform:translateY(14px);opacity:.35}35%,75%{transform:translateY(0);opacity:1}}@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}@keyframes sweep{0%{left:-25%}100%{left:125%}}@keyframes progress{0%{width:4%}80%,100%{width:100%}}
  </style>
</head>
<body><div class="scene"><div class="sweep"></div><div class="headline">TOWN CENTER SHIFT</div><div class="cards"><div class="card">356 HOMES</div><div class="card">GARAGE LINK</div><div class="card">COUNTY REVIEW</div></div><div class="progress"><span></span></div></div></body>
</html>
