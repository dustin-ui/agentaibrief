<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DMV Road Motion</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#10252b;color:#fff;font-family:Arial,sans-serif}.scene{position:relative;width:100%;height:100%;padding:7%;background:radial-gradient(circle at 75% 15%,#37b0c955,transparent 34%),linear-gradient(140deg,#0b2026,#315963)}.label{font-size:clamp(10px,1.7vw,18px);font-weight:900;letter-spacing:.14em;color:#93e7f3}.title{margin-top:8px;max-width:70%;font-size:clamp(23px,5.4vw,62px);font-weight:950;line-height:.93;letter-spacing:-.04em;animation:rise 7s ease-in-out infinite}.road{position:absolute;left:42%;right:-8%;bottom:-10%;height:75%;background:#26343a;clip-path:polygon(38% 0,63% 0,100% 100%,0 100%);box-shadow:0 0 0 7px #ffffff33 inset}.line{position:absolute;left:65%;bottom:-8%;width:3%;height:71%;background:repeating-linear-gradient(0deg,#fff 0 10%,transparent 10% 19%);transform:perspective(500px) rotate(19deg);animation:drive 1.9s linear infinite}.marker{position:absolute;right:9%;top:15%;width:17%;aspect-ratio:1;border:3px solid #37b0c9;border-radius:50%;animation:pulse 2.5s ease-out infinite}.cards{position:absolute;left:7%;bottom:16%;display:flex;gap:8px}.cards b{padding:7px 9px;background:#f1f6f7;color:#10252b;font-size:clamp(8px,1.4vw,14px);border-top:4px solid #37b0c9;animation:card 7s ease-in-out infinite;animation-delay:calc(var(--i)*.3s)}.bar{position:absolute;left:7%;right:7%;bottom:7%;height:6px;background:#ffffff2c;border-radius:9px;overflow:hidden}.bar span{display:block;height:100%;background:#37b0c9;animation:progress 7s ease-in-out infinite}@keyframes rise{0%,100%{transform:translateY(18px);opacity:.35}24%,76%{transform:none;opacity:1}}@keyframes drive{to{background-position:0 70px}}@keyframes pulse{0%{transform:scale(.3);opacity:1}100%{transform:scale(1.35);opacity:0}}@keyframes card{0%,100%{trans
