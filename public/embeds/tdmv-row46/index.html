<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Tysons Private Range and Lounge Motion</title>
  <style>
    *{box-sizing:border-box}
    html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#120f0c;color:#fff;font-family:Arial,sans-serif}
    .scene{position:relative;width:100%;height:100%;padding:7%;background:radial-gradient(circle at 78% 20%,#37b0c966,rgba(55,176,201,0) 34%),radial-gradient(circle at 40% 100%,#9a5a2f55,rgba(154,90,47,0) 42%),#120f0c}
    .grain{position:absolute;inset:0;opacity:.22;background-image:radial-gradient(#ffffff44 1px,rgba(255,255,255,0) 1px);background-size:19px 19px;animation:drift 7s ease-in-out infinite}
    .label{position:relative;font-size:clamp(10px,1.7vw,18px);font-weight:900;letter-spacing:.14em;color:#92e5f2;animation:labelIn 6.8s ease-in-out infinite}
    .title{position:relative;margin-top:9px;max-width:68%;font-size:clamp(23px,5.4vw,62px);font-weight:950;line-height:.93;letter-spacing:-.04em;animation:rise 6.8s ease-in-out infinite}
    .range{position:absolute;right:5%;bottom:16%;width:41%;height:46%;border:5px solid #d2a26b;border-top-color:#37b0c9;background:linear-gradient(90deg,#16191b,#303638 50%,#111416);clip-path:polygon(15% 0,85% 0,100% 100%,0 100%);box-shadow:0 0 35px #37b0c955;animation:rangePush 6.8s ease-in-out infinite}
    .range:before{content:"";position:absolute;left:15%;right:15%;top:18%;bottom:12%;background:repeating-linear-gradient(90deg,#37b0c9 0 3%,rgba(55,176,201,0) 3% 18%);opacity:.42}
    .smoke{position:absolute;right:11%;top:13%;width:18%;aspect-ratio:1;border:3px solid #d2a26b;border-radius:50%;animation:pulse 2.6s ease-out infinite}
    .cards{position:absolute;left:7%;bottom:17%;display:flex;gap:8px}
    .cards b{padding:7px 9px;background:#f3eee8;color:#17120f;font-size:clamp(8px,1.35vw,14px);border-top:4px solid #37b0c9;animation:card 6.8s ease-in-out infinite;animation-delay:calc(var(--i)*.22s)}
    .bar{position:absolute;left:7%;right:7%;bottom:7%;height:6px;background:#ffffff2c;border-radius:9px;overflow:hidden}
    .bar span{display:block;height:100%;background:#37b0c9;animation:progress 6.8s ease-in-out infinite}
    @keyframes labelIn{0%,100%{transform:translateX(-18px);opacity:.3}18%,80%{transform:none;opacity:1}}
    @keyframes rise{0%,100%{transform:translateY(24px) scale(.97);opacity:.2}24%,78%{transform:none;opacity:1}}
    @keyframes rangePush{0%,100%{transform:perspective(700px) rotateY(-8deg) translateX(18px);filter:brightness(.65)}30%,78%{transform:perspective(700px) rotateY(-3deg);filter:brightness(1.12)}}
    @keyframes pulse{0%{transform:scale(.25);opacity:1}100%{transform:scale(1.35);opacity:0}}
    @keyframes card{0%,100%{transform:translateY(22px);opacity:.15}26%,76%{transform:none;opacity:1}}
    @keyframes progress{0%{width:3%}80%,100%{width:100%}}
    @keyframes drift{0%,100%{transform:translate3d(-6px,-4px,0)}50%{transform:translate3d(8px,6px,0)}}
    @media(max-width:620px){.title{max-width:72%}.range{width:46%;right:1%}.cards{gap:3px}.cards b{padding:4px 5px;border-top-width:2px}}
  </style>
</head>
<body>
  <div class="scene">
    <div class="grain"></div>
    <div class="label">TYCO ROAD · PRIVATE MEMBERSHIP</div>
    <div class="title">RANGE.<br>LOUNGE.<br>ONE ADDRESS.</div>
    <div class="smoke"></div>
    <div class="range"></div>
    <div class="cards"><b style="--i:0">CONTROLLED ACCESS</b><b style="--i:1">FIVE LANES</b><b style="--i:2">TYSONS</b></div>
    <div class="bar"><span></span></div>
  </div>
</body>
</html>
