<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>
*{box-sizing:border-box}body{margin:0;background:#071014;color:#fff;font-family:Arial,Helvetica,sans-serif;overflow:hidden}.scene{position:relative;width:100vw;height:100vh;background:radial-gradient(circle at 82% 18%,#e85d2655,transparent 32%),linear-gradient(135deg,#071014,#15252b 68%,#071014);isolation:isolate}.grid{position:absolute;inset:-12%;background-image:linear-gradient(#ffffff12 1px,transparent 1px),linear-gradient(90deg,#ffffff12 1px,transparent 1px);background-size:44px 44px;transform:perspective(560px) rotateX(58deg) translateY(24%);animation:gridMove 9s linear 1 both}.copy{position:absolute;left:6%;top:10%;width:72%;z-index:3}.brand{display:inline-block;border:1px solid #e85d26;padding:6px 10px;color:#fff;font-weight:900;font-size:clamp(9px,1.4vw,15px);letter-spacing:.12em}.title{margin:14px 0 8px;font-size:clamp(26px,6vw,68px);line-height:.94;font-weight:950;letter-spacing:-.045em;text-shadow:0 7px 25px #000;animation:titleIn 7s cubic-bezier(.2,.8,.2,1) 1 both}.sub{font-size:clamp(10px,1.7vw,19px);font-weight:800;color:#dce9ec}.orbit{position:absolute;right:6%;top:8%;width:32vmin;height:32vmin;border:2px solid #e85d26;border-radius:50%;box-shadow:0 0 44px #e85d2666;animation:spin 8s linear 1 both}.orbit:before,.orbit:after{content:"";position:absolute;inset:20%;border:1px dashed #fff;border-radius:50%}.orbit:after{inset:42%;border:0;background:#e85d26;box-shadow:0 0 28px #e85d26;animation:pulse 2s ease-in-out 4 alternate}.rail{position:absolute;left:6%;right:6%;bottom:16%;display:grid;grid-template-columns:repeat(3,1fr);gap:14px;z-index:4}.node{position:relative;padding:14px 10px;background:#f3f2ed;color:#071014;border-top:6px solid #e85d26;font-size:clamp(9px,1.7vw,19px);font-weight:950;text-align:center;box-shadow:0 14px 35px #0008;transform:translateY(80px);opacity:0;animation:nodeIn 6.5s cubic-bezier(.2,.8,.2,1) 1 both;animation-delay:calc(var(--i)*.45s)}.node:not(:last-child):after{content:"";position:absolute;right:-18px;top:50%;width:22px;height:3px;background:#e85d26;box-shadow:0 0 12px #e85d26}.scan{position:absolute;top:0;bottom:0;left:-35%;width:26%;background:linear-gradient(90deg,transparent,#ffffff33,transparent);transform:skewX(-18deg);animation:sweep 7s ease-in-out 1 both;z-index:5}@keyframes gridMove{to{background-position:88px 88px}}@keyframes titleIn{0%{transform:translateX(-45px);opacity:0}18%,82%{transform:translateX(0);opacity:1}100%{transform:translateX(8px);opacity:1}}@keyframes spin{to{transform:rotate(270deg)}}@keyframes pulse{to{transform:scale(1.35);opacity:.55}}@keyframes nodeIn{0%{transform:translateY(80px);opacity:0}24%,100%{transform:translateY(0);opacity:1}}@keyframes sweep{0%,8%{left:-35%}78%,100%{left:125%}}@media(max-width:620px){.copy{top:8%;width:78%}.brand{font-size:8px;padding:4px 7px}.title{font-size:25px}.sub{font-size:9px}.orbit{right:3%;top:8%;width:28vmin;height:28vmin}.rail{left:4%;right:4%;bottom:14%;gap:5px}.node{padding:9px 3px;border-top-width:4px;font-size:7px}.node:not(:last-child):after{right:-8px;width:10px}}
</style></head><body><div class="scene"><div class="grid"></div><div class="copy"><div class="brand">AGENTAIBRIEF OPERATIONS</div><div class="title">THREE AI OPERATING LOOPS</div><div class="sub">Signal  •  Memory  •  Human Approval</div></div><div class="orbit"></div><div class="rail"><div class="node" style="--i:0">MARKET PULSE</div><div class="node" style="--i:1">EVERGREEN</div><div class="node" style="--i:2">AI VISIBILITY</div></div><div class="scan"></div></div></body></html>
