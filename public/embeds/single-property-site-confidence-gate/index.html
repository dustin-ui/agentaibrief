<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>AI confidence gate for listing photo labels</title>
  <style>
    *{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden}body{font-family:Inter,Arial,sans-serif;background:#0a1114;color:#fff}.scene{position:relative;width:100vw;height:100vh;background:linear-gradient(135deg,#071014 0,#15262d 58%,#071014 100%);isolation:isolate}.rings{position:absolute;right:8%;top:8%;width:36vmin;height:36vmin;border:2px solid #e85d26;border-radius:50%;box-shadow:0 0 50px rgba(232,93,38,.3);animation:spin 8s linear infinite}.rings:before,.rings:after{content:"";position:absolute;inset:15%;border:1px dashed rgba(255,255,255,.65);border-radius:50%}.rings:after{inset:39%;border:0;background:#e85d26;box-shadow:0 0 28px #e85d26;animation:pulse 1.8s ease-in-out infinite}.copy{position:absolute;left:6%;top:10%;width:62%;z-index:5}.kicker{display:inline-flex;padding:6px 10px;border:1px solid #e85d26;color:#ffb18f;background:rgba(7,16,20,.75);font-size:clamp(9px,1.25vw,13px);font-weight:900;letter-spacing:.14em;text-transform:uppercase}.title{margin:14px 0 0;font-size:clamp(28px,6.1vw,66px);line-height:.93;font-weight:950;letter-spacing:-.05em;text-shadow:0 8px 25px #000}.title em{display:block;color:#e85d26;font-style:normal}.decision{position:absolute;left:6%;right:6%;bottom:16%;display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;z-index:5}.step{min-height:82px;padding:15px;background:rgba(247,242,235,.96);color:#071014;border-left:8px solid #e85d26;box-shadow:0 15px 35px rgba(0,0,0,.38);transform:translateX(-70px);opacity:0;animation:step 6s ease-in-out infinite;animation-delay:calc(var(--i)*.45s)}.step b{display:block;font-size:clamp(11px,1.8vw,20px)}.step span{display:block;margin-top:6px;color:#536067;font-size:clamp(8px,1vw,12px);font-weight:700}.stamp{position:absolute;right:7%;bottom:7%;padding:8px 12px;border-radius:999px;background:#fff;color:#071014;font-size:clamp(8px,1.2vw,12px);font-weight:950;letter-spacing:.08em;animation:stamp 2.2s ease-in-out infinite}.line{position:absolute;left:6%;right:6%;bottom:11%;height:5px;background:rgba(255,255,255,.14);overflow:hidden}.line:after{content:"";display:block;width:28%;height:100%;background:#e85d26;box-shadow:0 0 18px #e85d26;animation:travel 5s ease-in-out infinite}@keyframes spin{to{transform:rotate(360deg)}}@keyframes pulse{50%{transform:scale(1.3);opacity:.72}}@keyframes step{0%{transform:translateX(-70px);opacity:0}19%,73%{transform:translateX(0);opacity:1}100%{transform:translateX(34px);opacity:0}}@keyframes stamp{50%{transform:scale(1.06);box-shadow:0 0 0 9px rgba(232,93,38,.13)}}@keyframes travel{0%{transform:translateX(-120%)}78%,100%{transform:translateX(405%)}}@media(max-width:620px){.copy{top:7%;width:74%}.title{font-size:24px}.rings{right:3%;top:7%;width:29vmin;height:29vmin}.decision{left:4%;right:4%;bottom:18%;gap:5px}.step{min-height:48px;padding:7px;border-left-width:4px}.step span{display:none}.stamp{right:4%;bottom:7%;padding:5px 8px}.line{left:4%;right:4%;bottom:11%}}
  </style>
</head>
<body><div class="scene"><div class="rings"></div><div class="copy"><div class="kicker">Accuracy before polish</div><div class="title">Classify. Verify.<em>Ask When Unsure.</em></div></div><div class="decision"><div class="step" style="--i:0"><b>HIGH CONFIDENCE</b><span>Clear room and level evidence</span></div><div class="step" style="--i:1"><b>CROSS-CHECK</b><span>Match finishes and sequence</span></div><div class="step" style="--i:2"><b>HUMAN DECIDES</b><span>Ambiguity stays visible</span></div></div><div class="line"></div><div class="stamp">NO GUESSING</div></div></body>
</html>
