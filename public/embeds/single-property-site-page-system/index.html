<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>The complete single property website system</title>
  <style>
    *{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden}body{font-family:Inter,Arial,sans-serif;background:#071014;color:#fff}.scene{position:relative;width:100vw;height:100vh;background:radial-gradient(circle at 20% 76%,#263b42 0,#101f25 31%,#071014 72%);isolation:isolate}.copy{position:absolute;left:6%;top:9%;width:65%;z-index:5}.kicker{display:inline-block;padding:6px 10px;border:1px solid #e85d26;color:#ffb18f;background:rgba(7,16,20,.76);font-size:clamp(9px,1.25vw,13px);font-weight:900;letter-spacing:.14em;text-transform:uppercase}.title{margin:14px 0 0;font-size:clamp(28px,5.8vw,64px);line-height:.93;font-weight:950;letter-spacing:-.05em;text-shadow:0 8px 25px #000}.title em{display:block;color:#e85d26;font-style:normal}.phone{position:absolute;right:7%;top:8%;width:21%;height:74%;border:7px solid #f4efe8;border-radius:24px;background:#121d22;box-shadow:0 20px 45px rgba(0,0,0,.5);overflow:hidden;animation:phone 5.5s ease-in-out infinite}.phone:before{content:"";position:absolute;left:18%;right:18%;top:4%;height:6%;border-radius:999px;background:#071014}.hero{position:absolute;inset:14% 7% 52%;background:linear-gradient(150deg,#e85d26,#344a52);animation:hero 6s ease-in-out infinite}.stats{position:absolute;left:7%;right:7%;top:52%;display:grid;grid-template-columns:repeat(3,1fr);gap:4px}.stats i{height:18px;background:#f4efe8;animation:stat 3s ease-in-out infinite;animation-delay:calc(var(--i)*.28s)}.gallery{position:absolute;left:7%;right:7%;top:65%;bottom:13%;display:grid;grid-template-columns:1fr 1fr;gap:4px}.gallery i{background:#536870;animation:tile 4s ease-in-out infinite;animation-delay:calc(var(--i)*.3s)}.bar{position:absolute;left:0;right:0;bottom:0;height:10%;background:#e85d26;animation:bar 2.2s ease-in-out infinite}.cards{position:absolute;left:6%;right:34%;bottom:16%;display:grid;grid-template-columns:repeat(4,1fr);gap:9px;z-index:4}.card{padding:14px 10px;border-top:5px solid #e85d26;background:#f5f0ea;color:#071014;box-shadow:0 14px 32px rgba(0,0,0,.38);transform:translateY(80px);opacity:0;animation:card 6.4s ease-in-out infinite;animation-delay:calc(var(--i)*.36s)}.card b{display:block;font-size:clamp(9px,1.45vw,16px)}.card span{display:block;margin-top:5px;color:#59656a;font-size:clamp(7px,.9vw,11px);font-weight:700}.sweep{position:absolute;top:-25%;bottom:-25%;left:-34%;width:24%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.23),transparent);transform:skewX(-18deg);animation:sweep 5.7s ease-in-out infinite;z-index:7}@keyframes phone{0%,100%{transform:translateY(8px) rotate(1deg)}50%{transform:translateY(-6px) rotate(-1deg)}}@keyframes hero{50%{transform:scale(1.08);filter:brightness(1.15)}}@keyframes stat{50%{background:#e85d26}}@keyframes tile{50%{transform:scale(.94);background:#78909a}}@keyframes bar{50%{filter:brightness(1.35)}}@keyframes card{0%{transform:translateY(80px);opacity:0}18%,72%{transform:translateY(0);opacity:1}100%{transform:translateY(-18px);opacity:0}}@keyframes sweep{0%,10%{left:-34%}60%,100%{left:126%}}@media(max-width:620px){.copy{top:7%;width:66%}.title{font-size:23px}.phone{right:4%;top:7%;width:27%;height:75%;border-width:4px;border-radius:14px}.cards{left:4%;right:35%;bottom:18%;grid-template-columns:repeat(2,1fr);gap:4px}.card{padding:6px;border-top-width:3px}.card span{display:none}}
  </style>
</head>
<body><div class="scene"><div class="copy"><div class="kicker">One page, property first</div><div class="title">Photos Become<em>A Guided Tour.</em></div></div><div class="phone"><div class="hero"></div><div class="stats"><i style="--i:0"></i><i style="--i:1"></i><i style="--i:2"></i></div><div class="gallery"><i style="--i:0"></i><i style="--i:1"></i><i style="--i:2"></i><i style="--i:3"></i></div><div class="bar"></div></div><div class="cards"><div class="card" style="--i:0"><b>HERO</b><span>Story begins instantly</span></div><div class="card" style="--i:1"><b>STATS</b><span>Key facts stay visible</span></div><div class="card" style="--i:2"><b>TOUR RAIL</b><span>Photos follow the house</span></div><div class="card" style="--i:3"><b>ACTIONS</b><span>Call, text, or tour</span></div></div><div class="sweep"></div></div></body>
</html>
