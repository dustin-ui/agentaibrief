<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Evidence funnel</title>
  <style>
    *{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden}body{font-family:Inter,Arial,sans-serif;background:#111316;color:#fff}.scene{position:relative;width:100vw;height:100vh;background:linear-gradient(135deg,#0a0e11,#182126 58%,#27170f);isolation:isolate}.rings{position:absolute;right:-5%;top:-18%;width:58vmin;height:58vmin;border:2px solid rgba(232,93,38,.5);border-radius:50%;animation:spin 12s linear infinite}.rings:before,.rings:after{content:"";position:absolute;inset:16%;border:1px dashed rgba(255,255,255,.4);border-radius:50%}.rings:after{inset:38%;background:#e85d26;border:0;box-shadow:0 0 45px rgba(232,93,38,.8);animation:pulse 1.8s ease-in-out infinite}.copy{position:absolute;left:6%;top:9%;width:62%;z-index:3}.kicker{color:#ffad88;font-size:clamp(9px,1.2vw,13px);font-weight:900;letter-spacing:.16em;text-transform:uppercase}.title{margin:11px 0 0;font-size:clamp(26px,5.7vw,61px);line-height:.93;font-weight:950;letter-spacing:-.04em}.title em{color:#e85d26;font-style:normal}.flow{position:absolute;left:6%;right:6%;top:49%;height:36%;display:grid;grid-template-columns:1fr 1.15fr 1fr;gap:4%;align-items:center;z-index:4}.stack{display:grid;gap:7px}.source{padding:8px 10px;background:#f5f0ea;color:#111316;border-left:5px solid #e85d26;font-size:clamp(8px,1.15vw,13px);font-weight:900;transform:translateX(-45px);opacity:0;animation:source 6s ease-in-out infinite;animation-delay:calc(var(--i)*.28s)}.funnel{position:relative;height:100%;clip-path:polygon(0 0,100% 0,67% 100%,33% 100%);background:linear-gradient(180deg,#e85d26,#a53a16);overflow:hidden;filter:drop-shadow(0 16px 25px rgba(0,0,0,.4))}.funnel:before{content:"";position:absolute;left:-20%;top:-25%;width:45%;height:150%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.44),transparent);transform:skewX(-15deg);animation:sweep 3.8s ease-in-out infinite}.funnel span{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;padding:10px;color:#fff;font-size:clamp(10px,1.5vw,16px);font-weight:950;letter-spacing:.08em}.findings{display:grid;gap:8px}.finding{display:flex;align-items:center;gap:8px;padding:9px 10px;border-radius:7px;background:rgba(255,255,255,.94);color:#111316;font-size:clamp(8px,1.1vw,12px);font-weight:900;transform:translateX(55px);opacity:0;animation:finding 6s ease-in-out infinite;animation-delay:calc(var(--i)*.33s)}.dot{width:12px;height:12px;border-radius:50%;background:var(--c);box-shadow:0 0 0 0 var(--c);animation:ring 2s infinite}.footer{position:absolute;left:6%;right:6%;bottom:4%;display:flex;justify-content:space-between;color:#ced7da;font-size:clamp(8px,1.1vw,13px);font-weight:800}.meter{width:42%;height:6px;background:rgba(255,255,255,.14);overflow:hidden;border-radius:9px}.meter i{display:block;width:30%;height:100%;background:#e85d26;animation:meter 4.6s ease-in-out infinite}@keyframes spin{to{transform:rotate(360deg)}}@keyframes pulse{50%{transform:scale(1.2);opacity:.7}}@keyframes source{0%{transform:translateX(-45px);opacity:0}18%,74%{transform:translateX(0);opacity:1}100%{transform:translateX(24px);opacity:0}}@keyframes finding{0%,12%{transform:translateX(55px);opacity:0}28%,78%{transform:translateX(0);opacity:1}100%{transform:translateX(-18px);opacity:0}}@keyframes sweep{0%{left:-30%}72%,100%{left:130%}}@keyframes ring{70%{box-shadow:0 0 0 14px transparent}}@keyframes meter{0%{transform:translateX(-110%)}80%,100%{transform:translateX(350%)}}@media(max-width:620px){.copy{top:7%;width:73%}.title{font-size:23px}.rings{right:-10%;top:-8%;width:35vmin;height:35vmin}.flow{left:4%;right:4%;top:48%;height:37%;gap:2%;grid-template-columns:1fr .85fr 1fr}.source,.finding{padding:5px;font-size:7px;border-left-width:3px}.dot{width:7px;height:7px}.funnel span{font-size:7px}.footer{left:4%;right:4%;bottom:3%}}
  </style>
</head>
<body><div class="scene"><div class="rings"></div><div class="copy"><div class="kicker">Trace every claim</div><div class="title">Links In.<em>Evidence Out.</em></div></div><div class="flow"><div class="stack"><div class="source" style="--i:0">OFFICIAL PORTAL</div><div class="source" style="--i:1">NATIVE PDF</div><div class="source" style="--i:2">PLAN ATTACHMENT</div><div class="source" style="--i:3">STATUS DATE</div></div><div class="funnel"><span>VERIFY<br>THE FILE</span></div><div class="findings"><div class="finding" style="--i:0"><i class="dot" style="--c:#d9493f"></i>ACTION</div><div class="finding" style="--i:1"><i class="dot" style="--c:#e6af2e"></i>VERIFY</div><div class="finding" style="--i:2"><i class="dot" style="--c:#3ba36c"></i>SUPPORTED</div><div class="finding" style="--i:3"><i class="dot" style="--c:#8b9499"></i>UNAVAILABLE</div></div></div><div class="footer"><span>Every conclusion keeps its source trail.</span><div class="meter"><i></i></div></div></div></body>
</html>
